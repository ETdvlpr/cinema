<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Showtimes for Alem, Century, GAST, Laphto Chewata and Garad cinemas in Addis Ababa, updated every 6 hours.">

  <!-- Link previews (Telegram, WhatsApp, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://etcinema.vercel.app/">
  <meta property="og:title" content="Addis Cinema · Showtimes in Addis Ababa">
  <meta property="og:description" content="What's on at Alem, Century, GAST, Laphto Chewata and Garad cinemas, updated every 6 hours.">
  <meta property="og:image" content="https://etcinema.vercel.app/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Addis Cinema">
  <meta name="theme-color" content="#0B0B10">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Addis Cinema · Showtimes in Addis Ababa</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0B0B10; }
    /* Shown while the Flutter engine and app download (a few seconds on mobile data). */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px; transition: opacity 250ms ease-out;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; border-radius: 24px; }
    #splash .spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(244, 184, 96, 0.2); border-top-color: #F4B860;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .spinner { animation-duration: 2.5s; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading Addis Cinema" role="progressbar">
    <img src="icons/Icon-192.png" alt="">
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const splash = document.getElementById('splash');
      splash.classList.add('done');
      setTimeout(() => splash.remove(), 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
