name: Update schedules

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (off the hour, when Actions queues are shorter)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-schedules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install .

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -m cinema_pipeline run --problems-file "$RUNNER_TEMP/problems.txt"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update schedules"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: backend/public

      - id: deploy
        uses: actions/deploy-pages@v4

      # Fail last, after publishing, so one broken channel doesn't block the rest.
      # A failed run makes GitHub email you.
      - name: Report problems
        run: |
          if [ -s "$RUNNER_TEMP/problems.txt" ]; then
            { echo "## Problems"; sed 's/^/- /' "$RUNNER_TEMP/problems.txt"; } >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/problems.txt"
            exit 1
          fi
