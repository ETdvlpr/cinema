# Public Telegram channels to watch.
#   id:      stable slug used in file paths and in schedules.json (don't change it once published)
#   name:    display name
#   channel: the part after https://t.me/  (the channel must be public: https://t.me/s/<channel> must load)
#
# Not included (checked 2026-10-05):
#   EB/EW Multiplex  @ebmultiplex       last post 2021
#   Ambassador       @ambassadorcinema  channel exists but has no posts yet
#   Sebastopol, Matti Multiplex         no public channel found
#   Edna Mall                           closed December 2021
cinemas:
  - id: alem
    name: Alem Cinema
    channel: alem_cinema

  - id: century
    name: Century Cinema
    channel: Century_Cinema

  - id: gast
    name: GAST Cinema
    channel: GastCinema
