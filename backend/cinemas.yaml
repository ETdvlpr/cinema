# Public Telegram channels to watch.
#   id:      stable slug used in file paths and in schedules.json (don't change it once published)
#   name:    display name
#   channel: the part after https://t.me/  (the channel must be public: https://t.me/s/<channel> must load)
#
# Not included (checked 2026-10-05):
#   EB/EW Multiplex  @ebmultiplex       last post 2021
#   Ambassador       @ambassadorcinema  channel exists but has no posts yet
#   Abel Cinema      @abelcinema        last post 2021
#   Sebastopol, Ambassador, Cinema Empire, Agona, Addis Cinema Complex, Videobet:
#                                       no public Telegram channel found (Videobet is Instagram-only)
#   Edna Mall / Matti Multiplex         closed December 2021
#   @addis_cinema, @etmdb, @FourtySecond  film-sharing / database / events channels, not venues
cinemas:
  - id: alem
    name: Alem Cinema
    channel: alem_cinema

  - id: century
    name: Century Cinema
    channel: Century_Cinema

  - id: gast
    name: GAST Cinema
    channel: GastCinema

  - id: chewata
    name: Laphto Chewata Cinema
    channel: chewatacinema

  - id: garad
    name: Garad Multi Cinema
    channel: garadmulticinema
